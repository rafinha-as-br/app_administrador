name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

defaults:
  run:
    working-directory: app_administrador

jobs:
  guard:
    name: Guard - geoprag_modules deve ser git dependency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bloqueia path dependency local
        run: |
          if grep -E "path:\s*\.\./" pubspec.yaml; then
            echo "::error::pubspec.yaml aponta geoprag_modules via path local (../). Troque para dependência git (ref: develop) antes de subir."
            exit 1
          fi

  quality-gates:
    name: Analyze, test & build web
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        # TODO: tirar o continue-on-error quando o teste hoje quebrado em
        # navigation_test.dart (GEOPRAG-65 - rota duplicada no menu a partir
        # do cadastro de Aplicador) for corrigido.
        continue-on-error: true
        run: flutter test

      - name: Build web
        run: flutter build web
